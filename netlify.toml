[build]
  command = "pnpm run build"
  functions = "netlify/functions"
  publish = "dist/spa"
  environment = { NODE_ENV = "production" }

[functions]
  external_node_modules = ["express", "pg", "cors"]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

# SPA catch-all - serve index.html for all routes except /api and static files
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
